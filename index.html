<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
</style>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>

<body>
<title>Mes LCR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E5A4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : écran d'appli à une colonne (max 560px), en-tête collant, mois en blocs empilés, feuilles qui montent du bas */
:root {
  --bg: #F3F6F5; --surface: #FFFFFF; --sunk: #E7EDEB; --line: #D5DEDB;
  --fg: #14211F; --muted: #5B6B67;
  --accent: #0E5A4E; --accent-fg: #FFFFFF; --accent-soft: #D7EAE5;
  --warn: #A15C00; --warn-soft: #FBEBD3; --bad: #B3261E; --bad-soft: #F9DEDC; --ok: #2F7D32;
  --font-display: "Sora", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1513; --surface: #16201E; --sunk: #1D2927; --line: #2A3835;
  --fg: #E5EEEB; --muted: #93A5A0;
  --accent: #5CC2AE; --accent-fg: #06201B; --accent-soft: #173A33;
  --warn: #F0B259; --warn-soft: #3A2A12; --bad: #F2867E; --bad-soft: #3D1A18; --ok: #7BCB7F;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #16201E; --sunk: #1D2927; --line: #2A3835;
  --fg: #E5EEEB; --muted: #93A5A0;
  --accent: #5CC2AE; --accent-fg: #06201B; --accent-soft: #173A33;
  --warn: #F0B259; --warn-soft: #3A2A12; --bad: #F2867E; --bad-soft: #3D1A18; --ok: #7BCB7F;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Écran de verrouillage ---------- */
#lock { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-block: 32px; }
#lock .wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
#lockTitle { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; margin: 0; text-wrap: balance; }
#lockSub { margin: -12px 0 0; color: var(--muted); max-width: 32ch; text-wrap: balance; }
.dots { display: flex; gap: 14px; height: 18px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); transition: background .12s, border-color .12s; }
.dots span.on { background: var(--accent); border-color: var(--accent); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
#lockMsg { min-height: 1.4em; margin: -6px 0 0; color: var(--bad); font-weight: 500; }
.pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 22px; }
.pad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--font-display); font-size: 1.6rem; font-weight: 500; }
.pad button:active { background: var(--accent-soft); }
.pad button.ghost { background: transparent; box-shadow: none; font-family: var(--font-body); font-size: .95rem; color: var(--muted); }
.pad button:disabled { opacity: .4; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px; }
.qform { width: 100%; max-width: 360px; display: grid; gap: 14px; text-align: left; }

/* ---------- Champs ---------- */
label.f { display: grid; gap: 5px; font-size: .82rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.f input, .f select, .f textarea, textarea.big { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; box-sizing: border-box; min-width: 0; }
.f input.num { font-family: var(--font-num); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2 > * { min-width: 0; }
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.sec { background: var(--sunk); color: var(--fg); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.full { width: 100%; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }

/* ---------- Appli ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--sunk); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.tools { display: flex; gap: 8px; }
main { padding-block: 18px 120px; display: grid; gap: 22px; }

.hero { background: var(--accent); color: var(--accent-fg); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.hero .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-weight: 600; }
.hero .big { font-size: 2rem; font-weight: 600; line-height: 1.1; }
.hero .sub { font-size: .88rem; opacity: .9; }
.hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid color-mix(in srgb, var(--accent-fg) 25%, transparent); padding-top: 12px; }
.hero .split .v { font-size: 1.1rem; font-weight: 600; }

.late { display: flex; align-items: center; gap: 10px; background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: 12px 14px; font-weight: 600; }

.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
.sect-h h2 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; margin: 0; }
.sect-h span { color: var(--muted); font-size: .82rem; }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; font-size: .86rem; }
.bar .m { color: var(--muted); text-transform: capitalize; }
.bar .track { height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; }
.bar.cur .m { color: var(--fg); font-weight: 600; }
.bar .amt { min-width: 92px; text-align: right; }

.month { display: grid; gap: 0; }
.month-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 2px 8px; }
.month-h h3 { margin: 0; font-family: var(--font-display); font-size: 1.12rem; font-weight: 600; text-transform: capitalize; }
.month-h .tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
.month-h .tot { text-align: right; }
.month-h .tot b { font-size: 1.05rem; display: block; }
.month-h .tot small { color: var(--muted); font-size: .76rem; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 12px 12px 8px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
.check svg { width: 16px; height: 16px; opacity: 0; }
.item.paid .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.item.paid .check svg { opacity: 1; }
.item .body { min-width: 0; background: none; border: 0; text-align: left; padding: 0; display: grid; gap: 2px; }
.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.item .amt { font-weight: 600; text-align: right; background: none; border: 0; padding: 0; }
.item .when { display: block; font-family: var(--font-body); font-size: .74rem; color: var(--muted); font-weight: 500; }
.item.paid .name, .item.paid .amt { color: var(--muted); text-decoration: line-through; }
.item.overdue .when { color: var(--bad); font-weight: 600; }
.item.soon .when { color: var(--warn); font-weight: 600; }
.chip { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); }

.empty { text-align: center; padding: 34px 18px; background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--font-display); margin: 0; font-size: 1.2rem; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.toggle-hist { justify-self: center; }
.exbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: var(--r); font-size: .88rem; font-weight: 500; }
.exbar button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px; }

.fab { position: fixed; z-index: 25; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 18px; padding: 16px 20px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 1rem; display: flex; gap: 8px; align-items: center; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }
.fab svg { width: 20px; height: 20px; }

/* ---------- Feuilles ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 15, 13, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding-block: 8px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); box-sizing: border-box; display: grid; gap: 16px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6 } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }
.sheet .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .acts .btn { flex: 1 1 140px; }
.calc { font-size: .84rem; color: var(--accent); font-weight: 500; margin-top: -6px; }
.menu { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.menu button { text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 2px; }
.menu button:first-child { border-top: 0; }
.menu button b { font-weight: 600; }
.menu button span { font-size: .82rem; color: var(--muted); }
.menu button.red b { color: var(--bad); }
textarea.big { min-height: 150px; resize: vertical; font-family: var(--font-num); font-size: 13px; }
.preview { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
.prev { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .86rem; }
.prev .meta { color: var(--muted); font-size: .78rem; }
.prev.bad { border-color: var(--bad); }
.seed { background: var(--accent-soft); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.seed b { display: block; font-family: var(--font-display); font-weight: 600; }
.seed span { font-size: .88rem; color: var(--muted); }
.seed .acts { display: flex; gap: 10px; align-items: center; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 360px) { .pad { grid-template-columns: repeat(3, 64px); gap: 12px 18px; } .pad button { width: 64px; height: 64px; } }
</style>

<!-- ================= VERROUILLAGE ================= -->
<section id="lock">
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Mes LCR</div>
    <h1 id="lockTitle">Chargement…</h1>
    <p id="lockSub"></p>

    <div id="padZone" hidden style="display:grid;gap:22px;justify-items:center">
      <div class="dots" id="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <p id="lockMsg" aria-live="polite"></p>
      <div class="pad" id="pad"></div>
      <button class="linkbtn" id="forgotBtn" hidden>Code oublié ?</button>
    </div>

    <form class="qform" id="qSetup" hidden>
      <label class="f">Question secrète
        <select id="qSel">
          <option>Nom de jeune fille de votre mère ?</option>
          <option>Nom de votre premier animal ?</option>
          <option>Ville de naissance de votre père ?</option>
          <option>Nom de votre école primaire ?</option>
          <option>Marque de votre première voiture ?</option>
          <option value="__custom">Écrire ma propre question…</option>
        </select>
      </label>
      <label class="f" id="qCustomWrap" hidden>Votre question
        <input id="qCustom" type="text" maxlength="120" autocomplete="off">
      </label>
      <label class="f">Réponse
        <input id="qAns" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      </label>
      <p class="hint">Les majuscules et les accents ne comptent pas. La réponse permet de choisir un nouveau code si vous oubliez le vôtre.</p>
      <button class="btn full" type="submit" id="qSubmit">Terminer</button>
      <button class="linkbtn" type="button" id="qCancel" hidden>Annuler</button>
    </form>

    <form class="qform" id="recover" hidden>
      <p style="margin:0;font-weight:600;font-size:1.05rem" id="recQ"></p>
      <label class="f">Votre réponse
        <input id="recAns" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      </label>
      <p id="recMsg" style="margin:0;color:var(--bad);font-weight:500;min-height:1.2em" aria-live="polite"></p>
      <button class="btn full" type="submit">Vérifier</button>
      <button class="linkbtn" type="button" id="recCancel">Retour au code</button>
    </form>
  </div>
</section>

<!-- ================= APPLI ================= -->
<section id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Mes LCR</div>
    <div class="tools">
      <button class="iconbtn" id="menuBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="iconbtn" id="lockBtn" aria-label="Verrouiller"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </div></header>
  <main class="wrap" id="main"></main>
  <button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une LCR</button>
</section>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const VAULT_KEY = 'mes-lcr-coffre-v1', TRY_KEY = 'mes-lcr-essais';
const ITER = 250000, AUTOLOCK_MS = 60000;
const enc = new TextEncoder(), dec = new TextDecoder();

/* ---------- Stockage local sûr ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

/* ---------- Chiffrement (AES-GCM, clé dérivée PBKDF2) ---------- */
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function kdf(secret, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(key, bytes) { const iv = rand(12); return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)) }; }
async function open_(key, o) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(o.iv) }, key, ub64(o.ct))); }
const normAns = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const importDataKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);

let vault = null;     // objet chiffré stocké
let rawKey = null;    // clé des données (en mémoire seulement une fois déverrouillé)
let dataKey = null;
let db = { lcr: [], delays: {} };

function loadVault() { try { const v = JSON.parse(store.get(VAULT_KEY) || 'null'); return v && v.v === 1 ? v : null; } catch { return null; } }
async function saveData() {
  vault.data = await seal(dataKey, enc.encode(JSON.stringify(db)));
  if (!store.set(VAULT_KEY, JSON.stringify(vault))) toast("Enregistrement impossible sur cet appareil : faites une sauvegarde.");
}
async function wrapWithPin(pin) { const s = rand(16); vault.sPin = b64(s); vault.wPin = await seal(await kdf(pin, s), rawKey); }
async function wrapWithAns(q, ans) { const s = rand(16); vault.q = q; vault.sAns = b64(s); vault.wAns = await seal(await kdf(normAns(ans), s), rawKey); }

/* ---------- Dates et montants ---------- */
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const mKey = s => s.slice(0, 7);
const mLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); };
const mShort = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') + ' ' + String(y).slice(2); };
const addMonths = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
const fmtD = s => { const d = parseISO(s); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }); };
const eur = n => n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const daysBetween = (a, b) => Math.round((b - a) / 86400000);

/* Délais de paiement usuels pour une LCR */
const DELAYS = [
  { id: '30fm', label: '30 jours fin de mois', days: 30, eom: true },
  { id: '45fm', label: '45 jours fin de mois', days: 45, eom: true },
  { id: '60fm', label: '60 jours fin de mois', days: 60, eom: true },
  { id: '30', label: '30 jours date de facture', days: 30 },
  { id: '45', label: '45 jours date de facture', days: 45 },
  { id: '60', label: '60 jours date de facture', days: 60 },
  { id: 'libre', label: 'Échéance libre (je la saisis)' }
];
function computeDue(fact, delayId) {
  const d = DELAYS.find(x => x.id === delayId); if (!d || !d.days || !fact) return null;
  const x = parseISO(fact); x.setDate(x.getDate() + d.days);
  return iso(d.eom ? new Date(x.getFullYear(), x.getMonth() + 1, 0) : x);
}

/* ================= ÉCRAN DE CODE ================= */
let padMode = null, entry = '', firstPin = '', busy = false;
const T = {
  create: ['Créez votre code', 'Choisissez 6 chiffres. Il vous sera demandé à chaque ouverture.'],
  confirm: ['Confirmez le code', 'Tapez les mêmes 6 chiffres.'],
  unlock: ['Entrez votre code', ''],
  newpin: ['Nouveau code', 'Choisissez 6 nouveaux chiffres.'],
  newconfirm: ['Confirmez le nouveau code', 'Tapez les mêmes 6 chiffres.']
};
function buildPad() {
  const keys = ['1','2','3','4','5','6','7','8','9','', '0','⌫'];
  $('#pad').innerHTML = keys.map(k => k === '' ? '<span></span>' :
    `<button type="button" data-k="${k}" ${k === '⌫' ? 'class="ghost" aria-label="Effacer"' : ''}>${k}</button>`).join('');
  $('#pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
  document.addEventListener('keydown', e => {
    if ($('#padZone').hidden || $('#lock').hidden) return;
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫');
  });
}
function showLock(view) {
  $('#app').hidden = true; $('#lock').hidden = false; closeSheet();
  $('#padZone').hidden = view !== 'pad'; $('#qSetup').hidden = view !== 'q'; $('#recover').hidden = view !== 'rec';
}
function setPad(mode, msg = '') {
  padMode = mode; entry = ''; showLock('pad'); drawDots();
  $('#lockTitle').textContent = T[mode][0]; $('#lockSub').textContent = T[mode][1]; $('#lockSub').hidden = !T[mode][1];
  $('#lockMsg').textContent = msg;
  $('#forgotBtn').hidden = mode !== 'unlock';
  checkThrottle();
}
function drawDots() { [...$('#dots').children].forEach((s, i) => s.classList.toggle('on', i < entry.length)); }
function shake(msg) { const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); $('#lockMsg').textContent = msg; entry = ''; drawDots(); }
async function press(k) {
  if (busy || throttled()) return;
  if (k === '⌫') { entry = entry.slice(0, -1); drawDots(); return; }
  if (entry.length >= 6) return;
  entry += k; drawDots(); $('#lockMsg').textContent = '';
  if (entry.length < 6) return;
  const pin = entry; busy = true;
  await new Promise(r => setTimeout(r, 120));
  try {
    if (padMode === 'create' || padMode === 'newpin') { firstPin = pin; setPad(padMode === 'create' ? 'confirm' : 'newconfirm'); }
    else if (padMode === 'confirm' || padMode === 'newconfirm') {
      if (pin !== firstPin) { setPad(padMode === 'confirm' ? 'create' : 'newpin'); shake('Les deux codes sont différents. Recommencez.'); }
      else if (padMode === 'confirm') { firstPin = pin; showQuestionSetup(false); }
      else { $('#lockTitle').textContent = 'Enregistrement…'; await wrapWithPin(pin); await saveData(); store.del(TRY_KEY); enterApp(); toast('Nouveau code enregistré'); }
    } else if (padMode === 'unlock') {
      $('#lockSub').hidden = false; $('#lockSub').textContent = 'Vérification…';
      try {
        rawKey = await open_(await kdf(pin, ub64(vault.sPin)), vault.wPin);
        await afterUnlock();
      } catch { $('#lockSub').hidden = true; failTry(); }
    }
  } finally { busy = false; }
}
async function afterUnlock() {
  dataKey = await importDataKey(rawKey);
  db = JSON.parse(dec.decode(await open_(dataKey, vault.data)));
  db.lcr ||= []; db.delays ||= {};
  store.del(TRY_KEY); enterApp();
}
/* Anti-essais : après 5 erreurs, attente croissante */
function tries() { try { return JSON.parse(store.get(TRY_KEY) || '{"n":0,"until":0}'); } catch { return { n: 0, until: 0 }; } }
function throttled() { return Date.now() < tries().until; }
function failTry() {
  const t = tries(); t.n++;
  if (t.n >= 5) t.until = Date.now() + 30000 * Math.pow(2, t.n - 5);
  store.set(TRY_KEY, JSON.stringify(t));
  shake(t.n >= 5 ? '' : `Code incorrect. ${5 - t.n} essai${5 - t.n > 1 ? 's' : ''} avant blocage.`);
  checkThrottle();
}
let thrTimer = null;
function checkThrottle() {
  clearInterval(thrTimer);
  const upd = () => {
    const s = Math.ceil((tries().until - Date.now()) / 1000);
    const on = s > 0 && padMode === 'unlock';
    $('#pad').querySelectorAll('button').forEach(b => b.disabled = on);
    if (on) $('#lockMsg').textContent = `Trop d'essais. Réessayez dans ${s} s.`;
    else { if (/Trop d'essais/.test($('#lockMsg').textContent)) $('#lockMsg').textContent = ''; clearInterval(thrTimer); }
  };
  upd(); if (throttled()) thrTimer = setInterval(upd, 1000);
}

/* ================= APPLI ================= */
let showHist = false;
function enterApp() { $('#lock').hidden = true; $('#app').hidden = false; render(); window.scrollTo(0, 0); }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

function render() {
  const t = today(), tIso = iso(t), cur = mKey(tIso), next = addMonths(cur, 1);
  const L = db.lcr;
  const unpaid = L.filter(x => !x.paye);
  const sumWhere = f => unpaid.filter(f).reduce((a, x) => a + x.montant, 0);
  const lateArr = unpaid.filter(x => x.echeance < tIso);
  const curLeft = sumWhere(x => mKey(x.echeance) === cur && x.echeance >= tIso);
  const nextTot = sumWhere(x => mKey(x.echeance) === next);
  const in30 = sumWhere(x => { const d = daysBetween(t, parseISO(x.echeance)); return d >= 0 && d <= 30; });
  let h = '';

  h += seedBanner();
  if (!L.length) {
    h += `<div class="empty">
      <h2>Aucune LCR pour l'instant</h2>
      <p>Ajoutez vos traites une par une, ou collez les lignes de votre fichier note pour les importer d'un coup.</p>
      <div class="acts" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn" data-act="add">Ajouter une LCR</button>
        <button class="btn sec" data-act="import">Importer mes notes</button>
      </div>
      <button class="linkbtn" data-act="examples">Voir avec des exemples</button>
    </div>`;
    $('#main').innerHTML = h; return;
  }

  if (L.some(x => x.ex)) h += `<div class="exbar"><span>Les lignes « Exemple » sont fictives.</span><button data-act="clearex">Les supprimer</button></div>`;

  h += `<div class="hero">
    <div><div class="lbl">Reste à payer en ${esc(mLabel(cur).split(' ')[0])}</div>
    <div class="big num">${eur(curLeft)}</div>
    <div class="sub">${unpaid.filter(x => mKey(x.echeance) === cur && x.echeance >= tIso).length} prélèvement(s) d'ici la fin du mois</div></div>
    <div class="split">
      <div><div class="lbl">${esc(mLabel(next).split(' ')[0])}</div><div class="v num">${eur(nextTot)}</div></div>
      <div><div class="lbl">30 prochains jours</div><div class="v num">${eur(in30)}</div></div>
    </div></div>`;

  if (lateArr.length) h += `<div class="late"><span>⚠</span><span>${lateArr.length} LCR échue(s) non cochée(s) payée(s) : ${eur(lateArr.reduce((a, x) => a + x.montant, 0))}</span></div>`;

  // Sorties prévues sur 6 mois
  const months = Array.from({ length: 6 }, (_, i) => addMonths(cur, i));
  const mt = months.map(k => sumWhere(x => mKey(x.echeance) === k));
  const max = Math.max(...mt, 1);
  h += `<section><div class="sect-h"><h2>Sorties prévues</h2><span>6 mois</span></div><div class="bars">` +
    months.map((k, i) => `<div class="bar ${i === 0 ? 'cur' : ''}"><span class="m">${esc(mShort(k))}</span><div class="track"><div class="fill" style="width:${(mt[i] / max * 100).toFixed(1)}%"></div></div><span class="amt num">${eur(mt[i])}</span></div>`).join('') +
    `</div></section>`;

  // Liste par mois d'échéance
  const groups = {};
  L.forEach(x => (groups[mKey(x.echeance)] ||= []).push(x));
  const keys = Object.keys(groups).sort();
  const past = keys.filter(k => k < cur), futur = keys.filter(k => k >= cur);
  const block = k => {
    const arr = groups[k].sort((a, b) => a.echeance.localeCompare(b.echeance) || a.fournisseur.localeCompare(b.fournisseur));
    const tot = arr.reduce((a, x) => a + x.montant, 0), paid = arr.filter(x => x.paye).reduce((a, x) => a + x.montant, 0);
    const tag = k === cur ? '<span class="tag">En cours</span>' : k === next ? '<span class="tag">À venir</span>' : '';
    return `<div class="month"><div class="month-h"><h3>${esc(mLabel(k))}${tag}</h3>
      <div class="tot"><b class="num">${eur(tot - paid)}</b><small>${paid ? `payé ${eur(paid)} sur ${eur(tot)}` : `${arr.length} LCR`}</small></div></div>
      <div class="list">${arr.map(x => itemHtml(x, t)).join('')}</div></div>`;
  };
  h += `<section style="display:grid;gap:22px"><div class="sect-h" style="margin:0"><h2>Par mois d'échéance</h2></div>`;
  // Les impayées des mois passés restent visibles même sans l'historique
  past.forEach(k => { if (showHist || groups[k].some(x => !x.paye)) h += block(k); });
  futur.forEach(k => h += block(k));
  if (past.some(k => groups[k].every(x => x.paye)))
    h += `<button class="btn sec toggle-hist" data-act="hist">${showHist ? 'Masquer' : 'Afficher'} les mois passés réglés</button>`;
  h += `</section>`;
  $('#main').innerHTML = h;
}
function itemHtml(x, t) {
  const d = daysBetween(t, parseISO(x.echeance));
  let when = `le ${fmtD(x.echeance)}`, cls = '';
  if (!x.paye) {
    if (d < 0) { when = `échue depuis ${-d} j`; cls = 'overdue'; }
    else if (d === 0) { when = "aujourd'hui"; cls = 'soon'; }
    else if (d <= 7) { when = `dans ${d} j`; cls = 'soon'; }
  } else when = 'payée';
  return `<div class="item ${x.paye ? 'paid' : ''} ${cls}" data-id="${x.id}">
    <button class="check" data-act="pay" aria-label="${x.paye ? 'Marquer non payée' : 'Marquer payée'}">${chk}</button>
    <button class="body" data-act="edit"><span class="name">${esc(x.fournisseur)}</span>
      <span class="meta"><span>Fact. ${x.facture ? fmtD(x.facture) : '—'}</span><span>Éch. ${fmtD(x.echeance)}</span>${x.numero ? `<span>N° ${esc(x.numero)}</span>` : ''}${x.ex ? '<span class="chip">Exemple</span>' : ''}</span></button>
    <button class="amt num" data-act="edit">${eur(x.montant)}<span class="when">${when}</span></button>
  </div>`;
}
$('#main').addEventListener('click', async e => {

  const act = b.dataset.act, id = b.closest('.item')?.dataset.id, x = db.lcr.find(y => y.id === id);
  if (act === 'pay' && x) { x.paye = !x.paye; render(); await saveData(); toast(x.paye ? `${x.fournisseur} : payée` : `${x.fournisseur} : à payer`); }
  if (act === 'edit' && x) openForm(x);
  if (act === 'add') openForm();
  if (act === 'import') openImport();
  if (act === 'seed') openImport(MES_NOTES);
  if (act === 'noseed') { db.seed1 = true; render(); await saveData(); }

  if (act === 'clearex') { db.lcr = db.lcr.filter(y => !y.ex); render(); await saveData(); toast('Exemples supprimés'); }
});
function uid() { return b64(rand(9)).replace(/[+/=]/g, ''); }
function addExamples() {
  const t = today(), k = mKey(iso(t));
  const d = (mo, day) => { const [y, m] = addMonths(k, mo).split('-').map(Number); return iso(new Date(y, m - 1, Math.min(day, new Date(y, m, 0).getDate()))); };
  [['Métaux du Sud', -1, 28, 0, 31, 1840.50], ['Distri Pro Emballages', -1, 15, 0, 31, 612.00], ['Transports Rivière', 0, 3, 1, 30, 2290.00],
   ['Métaux du Sud', 0, 12, 1, 30, 975.20], ['Bureau Plus', 0, 20, 1, 15, 148.90], ['Distri Pro Emballages', 1, 5, 2, 31, 734.00], ['Atelier Carré', 1, 9, 2, 31, 3120.00]]
    .forEach(([f, fm, fd, em, ed, m]) => db.lcr.push({ id: uid(), fournisseur: f, facture: d(fm, fd), echeance: d(em, ed), montant: m, paye: false, ex: true, delai: 'libre' }));
}

}
function parseAmount(s) {
  s = String(s).replace(/[€\s  ]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{3}$/.test(s) && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isFinite(n) ? n : NaN;
}

  <div class="menu">
    <button data-m="pin"><b>Changer le code</b><span>6 chiffres</span></button>
    <button data-m="q"><b>Changer la question secrète</b><span>${esc(vault.q)}</span></button>
  </div>
  <div class="menu"><button data-m="wipe" class="red"><b>Tout effacer</b><span>Supprime le coffre de cet appareil</span></button></div>
  <p class="hint">Vos données restent sur cet appareil, chiffrées avec votre code. L'appli se verrouille seule après une minute en arrière-plan.</p>`);
  $('#sheet').querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', async () => {
    const m = b.dataset.m;
    if (m === 'import') openImport();
    if (m === 'backup') openBackup();
    if (m === 'restore') openRestore();
    if (m === 'pin') setPad('newpin');
    if (m === 'q') showQuestionSetup(true);
    if (m === 'wipe') {
      if (!b.dataset.sure) { b.dataset.sure = 1; b.querySelector('b').textContent = 'Toucher encore : tout sera supprimé'; return; }
      store.del(VAULT_KEY); store.del(TRY_KEY); vault = null; rawKey = null; db = { lcr: [], delays: {} }; setPad('create');
    }
  }));
}
function openBackup() {
  const txt = JSON.stringify(vault);
  openSheet(`<h2>Sauvegarde</h2>
  <p class="hint">Ce texte est chiffré : sans votre code ou votre réponse secrète, il est illisible. Copiez-le dans un e-mail ou une note pour pouvoir restaurer vos LCR sur un autre téléphone.</p>
  <textarea class="big" id="bkTxt" readonly>${esc(txt)}</textarea>
  <div class="acts"><button class="btn" id="bkCopy">Copier</button><button class="btn sec" id="bkClose">Fermer</button></div>`);
  $('#bkClose').addEventListener('click', closeSheet);
  $('#bkCopy').addEventListener('click', () => {
    navigator.clipboard?.writeText(txt).then(() => toast('Sauvegarde copiée'), () => { $('#bkTxt').select(); toast('Sélectionné : faites Copier'); })
      ?? ($('#bkTxt').select(), toast('Sélectionné : faites Copier'));
  });
}
function openRestore() {
  openSheet(`<h2>Restaurer</h2>
  <p class="hint">Collez une sauvegarde. Elle remplacera les LCR de cet appareil, puis l'appli demandera le code de cette sauvegarde.</p>
  <textarea class="big" id="rsTxt" placeholder='{"v":1,…}'></textarea>
  <p id="rsMsg" style="margin:0;color:var(--bad);font-weight:500"></p>
  <div class="acts"><button class="btn" id="rsGo">Restaurer</button><button class="btn sec" id="rsClose">Annuler</button></div>`);
  $('#rsClose').addEventListener('click', closeSheet);
  $('#rsGo').addEventListener('click', () => {
    try { const v = JSON.parse($('#rsTxt').value.trim()); if (v.v !== 1 || !v.wPin || !v.data) throw 0;
      store.set(VAULT_KEY, JSON.stringify(v)); vault = v; lockNow(); toast('Sauvegarde restaurée : entrez son code');
    } catch { $('#rsMsg').textContent = 'Ce texte n’est pas une sauvegarde Mes LCR valide.'; }
  });
}

/* ---------- Notes de départ (novembre-décembre 2026) ---------- */
const MES_NOTES = '';
const seedBanner = () => (db.seed1 || !MES_NOTES) ? '' : `<div class="seed"><div><b>Tes LCR de novembre et décembre sont prêtes</b><span>Reprises de ton fichier note : 18 LCR à vérifier puis ajouter.</span></div>
  <div class="acts"><button class="btn" data-act="seed">Voir et ajouter</button><button class="linkbtn" data-act="noseed">Masquer</button></div></div>`;

/* ---------- Import depuis le fichier note ---------- */
function parseNotes(text) {
  const t = today(), out = [];
  const dateRe = /(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/g;
  for (const raw of text.split(/\n/)) {
    let line = raw.trim(); if (!line) continue;
    const dates = []; let m;
    dateRe.lastIndex = 0;
    while ((m = dateRe.exec(line))) {
      const d = +m[1], mo = +m[2]; if (d < 1 || d > 31 || mo < 1 || mo > 12) continue;
      let y = m[3] ? +m[3] : t.getFullYear(); if (y < 100) y += 2000;
      if (!m[3] && mo < t.getMonth() + 1 - 6) y++;
      dates.push(iso(new Date(y, mo - 1, d)));
    }
    let rest = line.replace(dateRe, ' ');
    const numRe = /\d{1,3}(?:[ \u00a0\u202f.]\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/g;
    const amts = rest.match(numRe);
    if (!amts || !dates.length) continue;
    // « 1756 + 337 + 1361 » : plusieurs LCR le même jour chez le même fournisseur
    const multi = /\d\s*€?\s*\+\s*\d/.test(rest);
    const amtStrs = multi ? amts : [amts[amts.length - 1]];
    if (multi) rest = rest.replace(numRe, ' ').replace(/\+/g, ' ');
    else { const i = rest.lastIndexOf(amtStrs[0]); rest = rest.slice(0, i) + rest.slice(i + amtStrs[0].length); }
    const fournisseur = rest.replace(/€/g, ' ').replace(/[:;|=\-–—>*•,()]+/g, ' ').split(/\s+/)
      .filter(w => w && !/^(fact(ure)?s?|fac|f|[ée]ch([ée]ance)?|lcr|eur(os?)?|montant|le|au)\.?$/i.test(w)).join(' ').trim();
    const [facture, echeance] = dates.length >= 2 ? [dates[0], dates[dates.length - 1]] : ['', dates[0]];
    amtStrs.forEach((a, k) => {
      const montant = parseAmount(a);
      out.push({ fournisseur: fournisseur || '(sans nom)', facture, echeance, montant, ok: montant > 0 && !!fournisseur, raw,
        note: amtStrs.length > 1 ? `LCR ${k + 1}/${amtStrs.length} du même jour` : '' });
    });
  }
  return out;
}
function openImport(prefill) {
  openSheet(`<h2>Importer mes notes</h2>
  <p class="hint">Collez vos lignes telles quelles. Une ligne par échéance : la date, le fournisseur et le montant. Plusieurs montants reliés par « + » donnent une LCR chacun. Si une ligne a deux dates, la première est la date de facture. Les titres de mois et les lignes de total sont ignorés.</p>
  <textarea class="big" id="imTxt" placeholder="Novembre&#10;05/11 Colombi 1094&#10;30/11 Europarm 826+463&#10;Bureau Plus fact 20/10/26 éch 15/11/26 148,90 €">${esc(prefill || '')}</textarea>
  <div class="acts"><button class="btn sec" id="imParse">Analyser</button></div>
  <div class="preview" id="imPrev"></div>
  <div class="acts"><button class="btn" id="imGo" hidden></button><button class="btn sec" id="imClose">Fermer</button></div>`);
  let rows = [];
  if (prefill) setTimeout(() => $('#imParse')?.click());
  $('#imClose').addEventListener('click', closeSheet);
  $('#imParse').addEventListener('click', () => {
    rows = parseNotes($('#imTxt').value);
    $('#imPrev').innerHTML = rows.length ? rows.map((r, i) => `<label class="prev ${r.ok ? '' : 'bad'}"><input type="checkbox" data-i="${i}" ${r.ok ? 'checked' : ''}>
      <span><b>${esc(r.fournisseur)}</b><br><span class="meta">Fact. ${r.facture ? fmtD(r.facture) : '—'} · Éch. ${fmtD(r.echeance)}</span></span>
      <span class="num">${isFinite(r.montant) ? eur(r.montant) : '?'}</span></label>`).join('')
      : '<p class="hint">Aucune ligne reconnue. Chaque ligne doit contenir au moins une date et un montant.</p>';
    const tots = {}; rows.forEach(r => { if (isFinite(r.montant)) tots[mKey(r.echeance)] = (tots[mKey(r.echeance)] || 0) + r.montant; });
    if (rows.length) $('#imPrev').insertAdjacentHTML('afterbegin', `<p class="hint" style="font-weight:600">${Object.keys(tots).sort().map(k => `Total ${esc(mLabel(k))} : <span class="num">${eur(tots[k])}</span>`).join('<br>')}</p>`);
    const upd = () => { const n = $('#imPrev').querySelectorAll('input:checked').length; $('#imGo').hidden = !n; $('#imGo').textContent = `Ajouter ${n} LCR`; };
    $('#imPrev').addEventListener('change', upd); upd();
  });
  $('#imGo').addEventListener('click', async () => {
    const sel = [...$('#imPrev').querySelectorAll('input:checked')].map(c => rows[+c.dataset.i]).filter(r => isFinite(r.montant));
    if (prefill) { db.seed1 = true; db.lcr = db.lcr.filter(y => !y.ex); }
    sel.forEach(r => db.lcr.push({ id: uid(), fournisseur: r.fournisseur, facture: r.facture, echeance: r.echeance, montant: Math.round(r.montant * 100) / 100, note: r.note, paye: false, delai: 'libre' }));
    closeSheet(); render(); await saveData(); toast(`${sel.length} LCR importée(s)`);
  });
}

let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400); }

/* ---------- Démarrage ---------- */
buildPad();
if (!window.crypto?.subtle) { $('#lockTitle').textContent = 'Navigateur non compatible'; $('#lockSub').textContent = 'Ouvrez l’appli dans Safari ou Chrome à jour.'; }
else { vault = loadVault(); setPad(vault ? 'unlock' : 'create'); }
})();
</script>
